[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "image-to-3d-print-agent"
version = "0.3.0"
description = "单图到3D打印的工具、Agent工作流和异步后端"
requires-python = ">=3.11"
dependencies = ["pydantic==2.12.5", "Pillow==10.1.0"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]
measurement = ["numpy==1.26.4", "trimesh==4.0.5"]
geometry = ["numpy==1.26.4", "trimesh==4.0.5", "networkx==3.5", "scipy==1.14.1"]
backend = ["fastapi==0.115.12", "uvicorn==0.34.3", "python-multipart==0.0.20", "httpx==0.28.1", "langgraph==0.6.7", "langgraph-checkpoint==2.1.2", "langgraph-checkpoint-sqlite==2.0.11", "psutil==7.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit", "tests/contract"]
addopts = "-ra"
